name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Platform Files & Build APK
        run: |
          mkdir build_app
          cd build_app
          flutter create --org com.dompetku.app --project-name dompetku .
          cp ../pubspec.yaml ./pubspec.yaml
          cp ../lib/main.dart ./lib/main.dart
          flutter pub get
          flutter build apk --release

      - name: Upload File DompetKu.apk
        uses: actions/upload-artifact@v4
        with:
          name: DompetKu-APK
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
